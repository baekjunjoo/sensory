<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffdf7" />
    <meta name="description" content="닷패드로 매일 도착하는 촉각 학습지를 풀며, 손끝으로 배우는 Sensory 데모" />
    <meta name="theme-color" content="#f8f4ea" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script defer src="https://cdn.jsdelivr.net/gh/baekjunjoo/sensory@79f303f/braille-engine.js"></script>
    <script>
      (() => {
        const watched = new WeakSet();
        const watchStylesheet = (link) => {
          if (watched.has(link)) return;
          watched.add(link);
          link.addEventListener("error", () => {
            const retryUrl = new URL(link.href, window.location.href);
            retryUrl.searchParams.set("css-retry", String(Date.now()));
            link.href = retryUrl.toString();
          }, { once: true });
        };

        const watchExisting = () => document.querySelectorAll('link[rel="stylesheet"]').forEach(watchStylesheet);
        new MutationObserver(watchExisting).observe(document.head, { childList: true });
        watchExisting();
      })();
    </script>
    <title>Sensory — 오늘의 촉각 학습지</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
